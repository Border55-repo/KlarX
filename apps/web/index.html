<!doctype html>
<html lang="nb" data-theme="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061a2e" />
    <meta name="description" content="Installerbar førstehjelpstrener for XABCDE og KFØR-kurset, med opplesning, scenarioer og spill." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KlarX" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>KlarX – førstehjelpstrener</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Hopp til innhold</a>
    <div class="app-shell">
      <div class="siren-line" aria-hidden="true"></div>
      <header class="topbar">
        <a class="brand" href="#home" aria-label="KlarX – hjem">
          <span class="brand-mark" aria-hidden="true">X</span>
          <span><strong>KlarX</strong><small>førstehjelpstrener</small></span>
        </a>
        <button class="icon-button" id="audio-toggle" type="button" aria-pressed="false" aria-label="Slå på automatisk opplesning"><span aria-hidden="true">◖)))</span></button>
      </header>

      <main id="main" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Hovedmeny">
        <a href="#home" data-nav="home"><span aria-hidden="true">⌂</span>Hjem</a>
        <a href="#learn" data-nav="learn"><span aria-hidden="true">ABC</span>XABCDE</a>
        <a href="#kfor" data-nav="kfor"><span aria-hidden="true">K</span>KFØR</a>
        <a href="#play" data-nav="play"><span aria-hidden="true">▶</span>Spill</a>
        <a href="#more" data-nav="more"><span aria-hidden="true">•••</span>Mer</a>
      </nav>
    </div>

    <dialog id="install-dialog" class="install-dialog" aria-labelledby="install-title">
      <button class="dialog-close" id="close-install" aria-label="Lukk">×</button>
      <span class="install-app-icon" aria-hidden="true">X</span>
      <h2 id="install-title">Installer KlarX</h2>
      <div id="install-guide"></div>
      <button class="button full" id="install-dialog-action">Skjønner</button>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
